name: Prevent new secrets

# Scan the new commits only. The repository has an older exposed SQL credential in
# its history; the operator must rotate it independently. No historical baseline
# is silently accepted, and this check does not claim to sanitize Git history.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan-new-commits:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history for commit-range scan
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan changed commits with Gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            echo "::error::Invalid base SHA; refusing to skip secret scan"
            exit 1
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          # Pin the trusted upstream image by version and linux/amd64 digest.
          # --redact prevents secret values from being shown in action logs.
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/repo:ro" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --no-banner --redact=100 --log-opts="${BASE_SHA}..${GITHUB_SHA}" /repo
