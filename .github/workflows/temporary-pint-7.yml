name: Temporary PHP formatter (phase 7)

on:
  push:
    branches:
      - feature/fase-7-saas-production-readiness
    paths:
      - '.github/workflows/temporary-pint-7.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/fase-7-saas-production-readiness
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, fileinfo, mbstring, zip
          coverage: none
      - name: Install formatter
        run: composer install --no-scripts --prefer-dist --no-interaction --no-progress
      - name: Format Laravel PHP
        run: ./vendor/bin/pint
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app bootstrap database routes tests
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Pint to phase 7 PHP"
            git push origin HEAD:feature/fase-7-saas-production-readiness
          fi
