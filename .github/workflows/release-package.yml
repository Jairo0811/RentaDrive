name: Release package (manual or tag)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure release commit is the current main tip
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, fileinfo, mbstring, xml, zip
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Require supported patched PHP
        run: php -r 'if (version_compare(PHP_VERSION, "8.4.27", "<")) exit(1);'

      - name: Validate and audit dependencies
        run: |
          composer validate --strict
          composer audit --locked --no-interaction
          npm ci
          npm audit --audit-level=high

      - name: Install runtime PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Build frontend
        run: npm run build

      - name: Create immutable release bundle and checksum
        run: |
          mkdir -p "$RUNNER_TEMP/rentadrive-release"
          tar -czf "$RUNNER_TEMP/rentadrive-release/rentadrive-$GITHUB_SHA.tar.gz" \
            --exclude=.git --exclude=.github --exclude=node_modules \
            --exclude=tests --exclude=.env --exclude='.env.*' \
            --exclude='storage/logs/*' --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            .
          cd "$RUNNER_TEMP/rentadrive-release"
          sha256sum "rentadrive-$GITHUB_SHA.tar.gz" > SHA256SUMS
          echo "Release commit: $GITHUB_SHA" > RELEASE-COMMIT.txt

      - name: Publish build artifact (not a deployment)
        uses: actions/upload-artifact@v4
        with:
          name: rentadrive-release-${{ github.sha }}
          path: ${{ runner.temp }}/rentadrive-release/
          retention-days: 14
          if-no-files-found: error
