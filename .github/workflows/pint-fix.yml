name: Pint Fix

on:
  push:
    branches:
      - feature/commercial-booking-ui
    paths:
      - .github/pint-fix-trigger

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, gd, iconv, libxml, simplexml, xml, xmlreader, xmlwriter, zip
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Format
        run: ./vendor/bin/pint

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app bootstrap config database routes tests
          git diff --cached --quiet && exit 0
          git commit -m "style: apply Laravel Pint"
          git push origin HEAD:${{ github.ref_name }}
