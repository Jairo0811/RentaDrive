name: Temporary Pint phase 5 and 6

on:
  push:
    branches:
      - feature/fases-5-6-digital-rental-automation
    paths:
      - '.github/workflows/format-phase56-temporary.yml'

permissions:
  contents: write

jobs:
  pint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/fases-5-6-digital-rental-automation
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, fileinfo, mbstring, pdo_sqlsrv, sqlsrv, xml, zip
          coverage: none
      - name: Install backend dependencies
        run: composer install --no-scripts --prefer-dist --no-interaction --no-progress
      - name: Apply Pint
        run: ./vendor/bin/pint
      - name: Commit style corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app database routes tests bootstrap
          if ! git diff --cached --quiet; then
            git commit -m "style: Pint for digital rental and automation"
            git push origin HEAD:feature/fases-5-6-digital-rental-automation
          fi
