name: Temporary S3 adapter lockfile update

on:
  push:
    branches:
      - feature/fase-7-saas-production-readiness
    paths:
      - '.github/workflows/temporary-s3-lock.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/fase-7-saas-production-readiness
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, fileinfo, mbstring, zip
          coverage: none
      - name: Install S3 Flysystem adapter
        run: composer require 'league/flysystem-aws-s3-v3:^3.0' --no-scripts --no-interaction --no-progress
      - name: Commit dependency lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.json composer.lock
          if ! git diff --cached --quiet; then
            git commit -m "build(storage): install Laravel S3 Flysystem adapter"
            git push origin HEAD:feature/fase-7-saas-production-readiness
          fi
