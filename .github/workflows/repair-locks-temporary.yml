name: Temporary lockfile repair

on:
  push:
    branches:
      - feature/fases-3-4-payments-dominican
    paths:
      - '.github/workflows/repair-locks-temporary.yml'

permissions:
  contents: write

jobs:
  update-lockfiles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/fases-3-4-payments-dominican
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: dom, fileinfo, mbstring, zip
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require patched PHP
        run: php -r 'if (version_compare(PHP_VERSION, "8.4.27", "<")) exit(1);'
      - name: Update vulnerable frontend lockfile
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Synchronize Composer lockfile hash
        run: composer update --lock --no-install --no-interaction
      - name: Commit repaired lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json composer.lock
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): patch Vite and synchronize PHP 8.4.27 Composer lock"
            git push origin HEAD:feature/fases-3-4-payments-dominican
          fi
